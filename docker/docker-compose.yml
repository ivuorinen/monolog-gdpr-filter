version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/app
      - composer-cache:/home/developer/.composer/cache
    working_dir: /app
    environment:
      - COMPOSER_HOME=/home/developer/.composer
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # PHP 8.5 for testing compatibility
  php85:
    image: php:8.5-cli-alpine
    # The stock image has no non-root user; match the Dockerfile's developer uid/gid
    # so this service does not run as root against the mounted source tree.
    user: "1000:1000"
    volumes:
      - ..:/app
    working_dir: /app
    profiles:
      - testing
    command: php -v

volumes:
  composer-cache:
