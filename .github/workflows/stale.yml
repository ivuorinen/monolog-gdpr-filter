---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Stale

on:
  schedule:
    - cron: "0 8 * * *" # Every day at 08:00
  workflow_call:
  workflow_dispatch:

# Deny by default; the stale job below grants exactly what it needs. Matches ci.yml
# and test-coverage.yaml, and stops a future job from silently inheriting more.
permissions: {}

jobs:
  stale:
    name: 🧹 Clean up stale issues and PRs
    runs-on: ubuntu-latest

    permissions:
      contents: write # only for delete-branch option
      issues: write
      pull-requests: write
    steps:
      - uses: ivuorinen/actions/stale@18927fb8ef81fdf20db6e4dde710cb0311338ad8 # v2026.07.29
