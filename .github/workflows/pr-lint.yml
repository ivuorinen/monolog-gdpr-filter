---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint Code Base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Linter:
    name: PR Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scoped to what the action actually needs:
    #   contents: write       APPLY_FIXES: all commits linter fixes back
    #   pull-requests: write  posts the MegaLinter PR comment
    #   statuses: write       GITHUB_STATUS_REPORTER: true in .mega-linter.yml
    #   packages: read        pulling the MegaLinter image from ghcr
    # `actions: write` and `issues: write` were dropped: nothing in
    # ivuorinen/actions/pr-lint touches the Actions or Issues APIs, and the action's own
    # header documents only contents/pull-requests as required.
    permissions:
      contents: write
      packages: read
      pull-requests: write
      statuses: write

    steps:
      - name: Run PR Lint
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@18927fb8ef81fdf20db6e4dde710cb0311338ad8 # v2026.07.29
